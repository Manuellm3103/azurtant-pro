<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AzurTant PRO — 3D Model Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #070b1a;
      color: #d4c6a8;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }
    #header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: linear-gradient(180deg, rgba(7,11,26,0.95) 0%, rgba(7,11,26,0) 100%);
    }
    #header h1 {
      font-size: 18px;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #d4c6a8, #c59b60);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input[type="file"] { display: none; }
    .btn {
      background: rgba(212,198,168,0.12);
      border: 1px solid rgba(212,198,168,0.35);
      color: #d4c6a8;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .btn:hover { background: rgba(212,198,168,0.25); border-color: #c59b60; }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #info {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      font-size: 12px;
      color: rgba(212,198,168,0.7);
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="header">
    <h1>⚡ AzurTant PRO 3D Viewer</h1>
    <div id="controls">
      <label class="btn" for="file-input">📂 Cargar modelo</label>
      <input id="file-input" type="file" accept=".glb,.gltf,.obj,.stl,.fbx,.ply">
      <button class="btn" id="btn-grid">⊞ Grid</button>
      <button class="btn" id="btn-wire">⧉ Wireframe</button>
    </div>
  </div>
  <div id="canvas-container"></div>
  <div id="info">Arrastra para rotar · Scroll para zoom · Click derecho para pan</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b1a);
    scene.fog = new THREE.Fog(0x070b1a, 10, 50);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(3, 2, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(5, 10, 7);
    dir.castShadow = true;
    scene.add(dir);
    const fill = new THREE.DirectionalLight(0xc59b60, 0.5);
    fill.position.set(-5, 2, -5);
    scene.add(fill);

    let gridHelper = new THREE.GridHelper(20, 40, 0x333333, 0x1a1a2e);
    scene.add(gridHelper);
    let wireframe = false;

    function fitCameraToObject(obj) {
      const box = new THREE.Box3().setFromObject(obj);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const fov = camera.fov * (Math.PI / 180);
      let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 2.5;
      camera.position.set(center.x + cameraZ * 0.6, center.y + cameraZ * 0.5, center.z + cameraZ);
      controls.target.copy(center);
      controls.update();
    }

    let current = null;
    function clearModel() {
      if (current) {
        scene.remove(current);
        current.traverse(o => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) {
            if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
            else o.material.dispose();
          }
        });
        current = null;
      }
    }

    function loadDefault() {
      const geo = new THREE.IcosahedronGeometry(1, 1);
      const mat = new THREE.MeshStandardMaterial({
        color: 0xd4c6a8,
        metalness: 0.6,
        roughness: 0.3,
        wireframe: wireframe
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      current = mesh;
      scene.add(mesh);
      fitCameraToObject(mesh);
    }

    function loadGLB(url) {
      clearModel();
      new GLTFLoader().load(url, gltf => {
        current = gltf.scene;
        current.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
        scene.add(current);
        fitCameraToObject(current);
      }, undefined, e => alert('Error cargando GLB: ' + e.message));
    }

    function loadOBJ(url) {
      clearModel();
      new OBJLoader().load(url, obj => {
        current = obj;
        current.traverse(o => { if (o.isMesh) { o.castShadow = true; o.material = new THREE.MeshStandardMaterial({ color: 0xd4c6a8, metalness: 0.6, roughness: 0.3 }); } });
        scene.add(current);
        fitCameraToObject(current);
      }, undefined, e => alert('Error cargando OBJ: ' + e.message));
    }

    function loadSTL(url) {
      clearModel();
      new STLLoader().load(url, geo => {
        const mat = new THREE.MeshStandardMaterial({ color: 0xd4c6a8, metalness: 0.5, roughness: 0.4 });
        current = new THREE.Mesh(geo, mat);
        current.castShadow = true; current.receiveShadow = true;
        scene.add(current);
        fitCameraToObject(current);
      }, undefined, e => alert('Error cargando STL: ' + e.message));
    }

    document.getElementById('file-input').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const ext = file.name.toLowerCase();
      if (ext.endsWith('.glb') || ext.endsWith('.gltf')) loadGLB(url);
      else if (ext.endsWith('.obj')) loadOBJ(url);
      else if (ext.endsWith('.stl')) loadSTL(url);
      else alert('Formato no soportado. Usa GLB, GLTF, OBJ o STL.');
    });

    document.getElementById('btn-grid').addEventListener('click', () => {
      gridHelper.visible = !gridHelper.visible;
    });
    document.getElementById('btn-wire').addEventListener('click', () => {
      wireframe = !wireframe;
      if (current) current.traverse(o => { if (o.material) o.material.wireframe = wireframe; });
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    loadDefault();
    function animate() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(animate); }
    animate();
  </script>
</body>
</html>
