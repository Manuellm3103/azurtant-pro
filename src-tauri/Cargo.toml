[package]
name = "azurant-pro"
version = "9.0.0"
description = "AzurTant PRO - Sistema Multi-Agente para Empresas Zero Employees"
authors = ["Emanuel Azur Corporativo"]
edition = "2021"

[lib]
name = "azurant_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
